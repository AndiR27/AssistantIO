# ==============================
#   VERSION & META
# ==============================
openapi: 3.0.4
info:
  title: AssistantIO API
  description: API de gestion des cours, TPs, étudiants et rendus.
  version: 1.0.0

# ==============================
#   SERVERS
# ==============================
servers:
  - url: http://localhost:8080
    description: Environnement local

# ==============================
#   TAGS
# ==============================
tags:
  - name: admin-course
    description: Gestion administrative des cours (CRUD complet)
  - name: course
    description: Consultation des cours et opérations associées
  - name: submission
    description: Gestion des soumissions de TP
  - name: tp-status
    description: Gestion des statuts des étudiants pour un TP
  - name: evaluation
    description: Gestion des évaluations des cours
  - name: course-access
    description: Opérations d’accès aux cours pour le partage





x-tagGroups:
  - name: Course
    tags:
      - course
  - name: Submission
    tags:
      - submission
  - name: Admin
    tags:
      - admin-course
  - name: TP Status
    tags:
      - tp-status
  - name: Evaluation
    tags:
      - evaluation
  - name: Course Access
    tags:
      - course-access


# ==============================
#   PATHS (ENDPOINTS)
# ==============================
paths:

  # ========================================
  #   ADMIN COURSES (CRUD)
  # ========================================
  /admin/courses:
    get:
      tags: [ admin-course ]
      summary: Liste des cours (admin).
      description: Retourne tous les cours pour la partie administrative.
      operationId: adminGetCourses
      responses:
        '200':
          description: Liste de cours retournée.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/CourseDto'
        '500':
          description: Erreur interne.
    post:
      tags: [ admin-course ]
      summary: Création d’un cours (admin).
      description: Crée un nouveau cours dans la partie administrative.
      operationId: adminCreateCourse
      requestBody:
        description: Données du cours à créer.
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CourseDto'
      responses:
        '201':
          description: Cours créé.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CourseDto'
        '400':
          description: Données invalides.
        '500':
          description: Erreur interne.
    put:
      tags: [ admin-course ]
      summary: Mise à jour d’un cours (admin).
      description: Met à jour les informations d’un cours existant.
      operationId: adminUpdateCourse
      requestBody:
        description: Données mises à jour du cours.
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CourseDto'
      responses:
        '200':
          description: Cours mis à jour.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CourseDto'
        '400':
          description: Données invalides.
        '404':
          description: Cours introuvable.
        '500':
          description: Erreur interne.
  /admin/courses/{courseId}:
    get:
      tags: [ admin-course ]
      summary: Détail d’un cours (admin).
      description: Retourne le détail d’un cours pour la partie administrative.
      operationId: adminGetCourseById
      parameters:
        - name: courseId
          in: path
          required: true
          description: Identifiant du cours.
          schema:
            type: integer
            format: int64
      responses:
        '200':
          description: Cours trouvé.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CourseDto'
        '404':
          description: Cours introuvable.
        '500':
          description: Erreur interne.

    delete:
      tags: [ admin-course ]
      summary: Suppression d’un cours (admin).
      description: Supprime un cours existant.
      operationId: adminDeleteCourse
      parameters:
        - name: courseId
          in: path
          required: true
          description: Identifiant du cours à supprimer.
          schema:
            type: integer
            format: int64
      responses:
        '204':
          description: Cours supprimé.
        '404':
          description: Cours introuvable.
        '500':
          description: Erreur interne.
  # ========================================
  #   COURSE ACCESS (RBAC / SHARING)
  # ========================================
  /course-access/grant:
    post:
      tags: [ course-access ]
      summary: Accorder ou mettre à jour un accès à un cours.
      description: |
        Donne (ou met à jour) une permission à un utilisateur sur un cours.
        Si une entrée existe déjà pour (userId, courseId), la permission est mise à jour.
      operationId: grantCourseAccess
      parameters:
        - name: userId
          in: query
          required: true
          description: Identifiant utilisateur (Keycloak userId).
          schema:
            type: string
          example: "2f1c3a9d-1234-4567-8901-abcdef123456"
        - name: courseId
          in: query
          required: true
          description: Identifiant du cours.
          schema:
            type: integer
            format: int64
          example: 10
        - name: permission
          in: query
          required: true
          description: Permission à accorder.
          schema:
            type: string
            enum: [ READ, WRITE, OWNER ]
          example: READ
      responses:
        '200':
          description: Accès accordé / mis à jour.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CourseAccessDto'
        '400':
          description: Données invalides.
        '500':
          description: Erreur interne.

  /course-access/revoke:
    delete:
      tags: [ course-access ]
      summary: Révoquer l’accès d’un utilisateur à un cours.
      description: Supprime l’accès (toutes permissions) d’un utilisateur pour un cours.
      operationId: revokeCourseAccess
      parameters:
        - name: userId
          in: query
          required: true
          description: Identifiant utilisateur (Keycloak userId).
          schema:
            type: string
          example: "2f1c3a9d-1234-4567-8901-abcdef123456"
        - name: courseId
          in: query
          required: true
          description: Identifiant du cours.
          schema:
            type: integer
            format: int64
          example: 10
      responses:
        '204':
          description: Accès révoqué.
        '400':
          description: Paramètres invalides.
        '500':
          description: Erreur interne.

  /course-access/share/{courseId}:
    post:
      tags: [ course-access ]
      summary: Partager un cours avec un utilisateur (READ par défaut).
      description: Partage un cours avec un utilisateur cible. Par défaut, la permission accordée est READ.
      operationId: shareCourseDefaultPermission
      parameters:
        - name: courseId
          in: path
          required: true
          description: Identifiant du cours.
          schema:
            type: integer
            format: int64
          example: 10
        - name: targetUserId
          in: query
          required: true
          description: Identifiant utilisateur cible (Keycloak userId).
          schema:
            type: string
          example: "2f1c3a9d-1234-4567-8901-abcdef123456"
      responses:
        '200':
          description: Cours partagé.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CourseAccessDto'
        '400':
          description: Données invalides.
        '404':
          description: Cours introuvable.
        '500':
          description: Erreur interne.

  /course-access/share/{courseId}/with-permission:
    post:
      tags: [ course-access ]
      summary: Partager un cours avec une permission spécifique.
      description: Partage un cours avec un utilisateur cible avec une permission donnée.
      operationId: shareCourseWithPermission
      parameters:
        - name: courseId
          in: path
          required: true
          description: Identifiant du cours.
          schema:
            type: integer
            format: int64
          example: 10
        - name: targetUserId
          in: query
          required: true
          description: Identifiant utilisateur cible (Keycloak userId).
          schema:
            type: string
          example: "2f1c3a9d-1234-4567-8901-abcdef123456"
        - name: permission
          in: query
          required: true
          description: Permission à accorder.
          schema:
            type: string
            enum: [ READ, WRITE, OWNER ]
          example: READ
      responses:
        '200':
          description: Cours partagé.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CourseAccessDto'
        '400':
          description: Données invalides.
        '404':
          description: Cours introuvable.
        '500':
          description: Erreur interne.

  /course-access/unshare/{courseId}:
    post:
      tags: [ course-access ]
      summary: Retirer le partage d’un cours pour un utilisateur.
      description: Retire l’accès d’un utilisateur cible à un cours (équivalent revoke).
      operationId: unshareCourse
      parameters:
        - name: courseId
          in: path
          required: true
          description: Identifiant du cours.
          schema:
            type: integer
            format: int64
          example: 10
        - name: targetUserId
          in: query
          required: true
          description: Identifiant utilisateur cible (Keycloak userId).
          schema:
            type: string
          example: "2f1c3a9d-1234-4567-8901-abcdef123456"
      responses:
        '204':
          description: Partage retiré.
        '400':
          description: Données invalides.
        '404':
          description: Cours introuvable.
        '500':
          description: Erreur interne.

  /course-access/has-permission:
    get:
      tags: [ course-access ]
      summary: Vérifier si un utilisateur a une permission minimale sur un cours.
      description: Retourne true/false si l’utilisateur possède au moins le niveau de permission requis.
      operationId: hasCoursePermission
      parameters:
        - name: userId
          in: query
          required: true
          schema: { type: string }
          example: "2f1c3a9d-1234-4567-8901-abcdef123456"
        - name: courseId
          in: query
          required: true
          schema: { type: integer, format: int64 }
          example: 10
        - name: required
          in: query
          required: true
          description: Permission minimale requise.
          schema:
            type: string
            enum: [ READ, WRITE, OWNER ]
          example: READ
      responses:
        '200':
          description: Résultat du check.
          content:
            application/json:
              schema:
                type: boolean
                example: true
        '400':
          description: Paramètres invalides.
        '500':
          description: Erreur interne.

  /course-access/permission:
    get:
      tags: [ course-access ]
      summary: Récupérer la permission d’un utilisateur sur un cours.
      description: Retourne le niveau de permission actuel (ou 204 si aucune entrée).
      operationId: getCoursePermission
      parameters:
        - name: userId
          in: query
          required: true
          schema: { type: string }
        - name: courseId
          in: query
          required: true
          schema: { type: integer, format: int64 }
      responses:
        '200':
          description: Permission trouvée.
          content:
            application/json:
              schema:
                type: string
                enum: [ READ, WRITE, OWNER ]
                example: READ
        '204':
          description: Aucun accès défini.
        '400':
          description: Paramètres invalides.
        '500':
          description: Erreur interne.

  /course-access/my-accesses:
    get:
      tags: [ course-access ]
      summary: Mes accès cours (utilisateur courant).
      description: Retourne tous les CourseAccess de l'utilisateur authentifié (email extrait du JWT).
      operationId: getMyAccesses
      responses:
        '200':
          description: Liste des accès cours de l'utilisateur courant.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/CourseAccessDto'
        '500':
          description: Erreur interne.

  /course-access/accessible-courses:
    get:
      tags: [ course-access ]
      summary: Liste des IDs de cours accessibles par un utilisateur.
      description: Retourne la liste des courseId auxquels l’utilisateur a accès.
      operationId: getAccessibleCourseIds
      parameters:
        - name: userId
          in: query
          required: true
          schema: { type: string }
          example: "2f1c3a9d-1234-4567-8901-abcdef123456"
      responses:
        '200':
          description: Liste des cours accessibles.
          content:
            application/json:
              schema:
                type: array
                items:
                  type: integer
                  format: int64
              example: [ 10, 11, 12 ]
        '400':
          description: Paramètres invalides.
        '500':
          description: Erreur interne.

  /course-access/course/{courseId}/shares:
    get:
      tags: [ course-access ]
      summary: Liste des partages (utilisateurs) d’un cours.
      description: Retourne tous les CourseAccess associés à un cours.
      operationId: getCourseShares
      parameters:
        - name: courseId
          in: path
          required: true
          description: Identifiant du cours.
          schema:
            type: integer
            format: int64
          example: 10
      responses:
        '200':
          description: Liste des partages du cours.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/CourseAccessDto'
        '404':
          description: Cours introuvable.
        '500':
          description: Erreur interne.

  /course-access/course/{courseId}:
    delete:
      tags: [ course-access ]
      summary: Supprimer tous les accès d’un cours.
      description: Supprime toutes les entrées d’accès pour un cours (utile lors de la suppression du cours).
      operationId: deleteAllAccessForCourse
      parameters:
        - name: courseId
          in: path
          required: true
          description: Identifiant du cours.
          schema:
            type: integer
            format: int64
          example: 10
      responses:
        '204':
          description: Accès supprimés.
        '404':
          description: Cours introuvable.
        '500':
          description: Erreur interne.


  # ========================================
  #   COURSES (LECTURE)
  # ========================================
  /course:
    get:
      tags: [ course ]
      summary: Liste des cours.
      description: Retourne tous les cours accessibles.
      operationId: getCourses
      responses:
        '200':
          description: Liste de cours retournée.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/CourseDto'
        '500':
          description: Erreur interne.

  /course/{courseId}:
    get:
      tags: [ course ]
      summary: Détails d’un cours.
      description: Retourne les informations d’un cours spécifique.
      operationId: getCourseById
      parameters:
        - name: courseId
          in: path
          required: true
          description: Identifiant du cours.
          schema:
            type: integer
            format: int64
      responses:
        '200':
          description: Cours trouvé.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CourseDto'
        '404':
          description: Cours introuvable.
        '500':
          description: Erreur interne.

  # ========================================
  #   STUDENTS D’UN COURS (REST PRINCIPAL)
  # ========================================
  /course/{courseId}/students:
    get:
      tags: [ course ]
      summary: Liste des étudiants d’un cours.
      description: Retourne les étudiants inscrits à un cours.
      operationId: getStudentsByCourse
      parameters:
        - name: courseId
          in: path
          required: true
          description: Identifiant du cours.
          schema:
            type: integer
            format: int64
      responses:
        '200':
          description: Liste d’étudiants retournée.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/StudentDto'
        '404':
          description: Cours introuvable.
        '500':
          description: Erreur interne.

  /course/{courseId}/students/{studentId}:
    put:
      tags: [ course ]
      summary: Mise à jour d’un étudiant d’un cours.
      description: Met à jour les informations d’un étudiant (nom, email, filière).
      operationId: updateStudent
      parameters:
        - name: courseId
          in: path
          required: true
          description: Identifiant du cours.
          schema:
            type: integer
            format: int64
        - name: studentId
          in: path
          required: true
          description: Identifiant de l’étudiant.
          schema:
            type: integer
            format: int64
      requestBody:
        description: Nouvelles données de l’étudiant.
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/StudentDto'
      responses:
        '200':
          description: Étudiant mis à jour.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StudentDto'
        '404':
          description: Cours ou étudiant introuvable.
        '500':
          description: Erreur interne.
    delete:
      tags: [ course ]
      summary: Suppression d’un étudiant d’un cours.
      description: Retire un étudiant d’un cours à partir de son identifiant.
      operationId: removeStudentFromCourse
      parameters:
        - name: courseId
          in: path
          required: true
          description: Identifiant du cours.
          schema:
            type: integer
            format: int64
        - name: studentId
          in: path
          required: true
          description: Identifiant de l’étudiant.
          schema:
            type: integer
            format: int64
      responses:
        '204':
          description: Étudiant retiré du cours.
        '404':
          description: Cours ou étudiant introuvable.
        '500':
          description: Erreur interne.
    get:
      tags: [ course ]
      summary: Détail d'un étudiant d'un cours.
      description: Retourne un étudiant spécifique à un cours.
      operationId: getStudentFromCourse
      parameters:
        - name: courseId
          in: path
          required: true
          description: Identifiant du cours.
          schema:
            type: integer
            format: int64
        - name: studentId
          in: path
          required: true
          description: Identifiant de l’étudiant.
          schema:
            type: integer
            format: int64
      responses:
        '201':
          description: Etudiant trouvé.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StudentDto'
        '404':
          description: Etudiant introuvable.
        '500':
          description: Erreur interne.
  # ========================================
  #   STUDENTS D’UN COURS (ROUTES SPÉCIFIQUES EXISTANTES)
  # ========================================
  /course/{courseId}/addStudent:
    post:
      tags: [ course ]
      summary: Ajout d’un étudiant (route spécifique).
      description: Ajoute un étudiant à un cours via une route spécifique existante.
      operationId: addStudent
      parameters:
        - name: courseId
          in: path
          required: true
          description: Identifiant du cours.
          schema:
            type: integer
            format: int64
      requestBody:
        description: Données de l’étudiant à ajouter.
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/StudentDto'
      responses:
        '201':
          description: Étudiant ajouté.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StudentDto'
        '404':
          description: Cours introuvable.
        '500':
          description: Erreur interne.

  /course/{courseId}/addStudentsFromFile:
    post:
      tags: [ course ]
      summary: Ajout d’étudiants depuis un fichier.
      description: Ajoute plusieurs étudiants à partir d’un fichier texte.
      operationId: addStudentsFromFile
      parameters:
        - name: courseId
          in: path
          required: true
          description: Identifiant du cours.
          schema:
            type: integer
            format: int64
      requestBody:
        description: Fichier texte contenant la liste des étudiants.
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              properties:
                file:
                  type: string
                  format: binary
      responses:
        '200':
          description: Étudiants ajoutés.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/StudentDto'
        '400':
          description: Fichier invalide.
        '404':
          description: Cours introuvable.
        '500':
          description: Erreur interne.

  # ========================================
  #   TPS D’UN COURS (REST PRINCIPAL)
  # ========================================
  /course/{courseId}/TPs:
    get:
      tags: [ course ]
      summary: Liste des TPs d’un cours.
      description: Retourne les TPs associés à un cours.
      operationId: getTPsByCourse
      parameters:
        - name: courseId
          in: path
          required: true
          description: Identifiant du cours.
          schema:
            type: integer
            format: int64
      responses:
        '200':
          description: Liste de TPs retournée.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/TPDto'
        '404':
          description: Cours introuvable.
        '500':
          description: Erreur interne.


  # Routes spécifique de gestion des TPs par leur numéro
  /course/{courseId}/TPs/{tpNumber}:
    post:
      tags: [ course ]
      summary: Création d’un TP par numéro.
      description: Crée un TP en utilisant directement le numéro de TP.
      operationId: addTPByNumber
      parameters:
        - name: courseId
          in: path
          required: true
          description: Identifiant du cours.
          schema:
            type: integer
            format: int64
        - name: tpNumber
          in: path
          required: true
          description: Numéro du TP.
          schema:
            type: integer
      responses:
        '201':
          description: TP créé.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TPDto'
        '404':
          description: Cours introuvable.
        '500':
          description: Erreur interne.
    get:
      tags: [ course ]
      summary: Détail d’un TP.
      description: Retourne les informations d’un TP spécifique.
      operationId: getTPById
      parameters:
        - name: courseId
          in: path
          required: true
          description: Identifiant du cours.
          schema:
            type: integer
            format: int64
        - name: tpNumber
          in: path
          required: true
          description: Numéro du TP.
          schema:
            type: integer
      responses:
        '200':
          description: TP trouvé.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TPDto'
        '404':
          description: TP ou cours introuvable.
        '500':
          description: Erreur interne.

    delete:
      tags: [ course ]
      summary: Suppression d’un TP.
      description: Supprime un TP existant d’un cours.
      operationId: deleteTP
      parameters:
        - name: courseId
          in: path
          required: true
          description: Identifiant du cours.
          schema:
            type: integer
            format: int64
        - name: tpNumber
          in: path
          required: true
          description: Numéro du TP.
          schema:
            type: integer
      responses:
        '204':
          description: TP supprimé.
        '404':
          description: TP ou cours introuvable.
        '500':
          description: Erreur interne.
    put:
      tags: [ course ]
      summary: Mise à jour d’un TP.
      description: Met à jour les informations d’un TP existant.
      operationId: updateTP
      parameters:
        - name: courseId
          in: path
          required: true
          description: Identifiant du cours.
          schema:
            type: integer
            format: int64
        - name: tpNumber
          in: path
          required: true
          description: Numéro du TP.
          schema:
            type: integer
      requestBody:
        description: Données mises à jour du TP.
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TPDto'
      responses:
        '200':
          description: TP mis à jour.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TPDto'
        '404':
          description: TP ou cours introuvable.
        '500':
          description: Erreur interne.
  #========================================
  #EVALUATIONS D’UN COURS
  /course/{courseId}/evaluations:
    get:
      tags: [ course ]
      summary: Liste des évaluations d’un cours.
      description: Retourne les évaluations associées à un cours.
      operationId: getEvaluationsByCourse
      parameters:
        - name: courseId
          in: path
          required: true
          description: Identifiant du cours.
          schema:
            type: integer
            format: int64
      responses:
        '200':
          description: Liste d’évaluations retournée.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/EvaluationDto'
        '404':
          description: Cours introuvable.
        '500':
          description: Erreur interne.
    post:
      tags: [ course ]
      summary: Création d’une évaluation.
      description: Crée une nouvelle évaluation pour un cours.
      operationId: createEvaluationInCourse
      parameters:
        - name: courseId
          in: path
          required: true
          description: Identifiant du cours.
          schema:
            type: integer
            format: int64
      requestBody:
        description: Données de l’évaluation.
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/EvaluationDto'
      responses:
        '201':
          description: Évaluation créée.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EvaluationDto'
        '404':
          description: Cours introuvable.
        '500':
          description: Erreur interne.
