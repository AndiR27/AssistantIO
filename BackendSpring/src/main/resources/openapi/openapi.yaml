  # ========================================
  #   RENDUS ET TRAITEMENT DE TP
  # ========================================
  /course/{courseId}/addRendu/{tpNo}:
    post:
      tags: [ submission ]
      summary: Ajout d’un rendu de TP.
      description: Ajoute un rendu de TP sous forme de fichier ZIP.
      operationId: addSubmission
      parameters:
        - name: courseId
          in: path
          required: true
          description: Identifiant du cours.
          schema:
            type: integer
            format: int64
        - name: tpNo
          in: path
          required: true
          description: Numéro de TP.
          schema:
            type: integer
      requestBody:
        description: Fichier ZIP contenant les rendus d’étudiants.
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              properties:
                file:
                  type: string
                  format: binary
      responses:
        '201':
          description: Rendu ajouté.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SubmissionDto'
        '400':
          description: Fichier invalide.
        '404':
          description: Cours ou TP introuvable.
        '500':
          description: Erreur interne.

  /course/{courseId}/startProcessSubmission/{tpNo}:
    post:
      tags: [ submission ]
      summary: Lancement du traitement des rendus.
      description: Lance le processus de restructuration et de traitement des rendus pour un TP.
      operationId: startProcessSubmission
      parameters:
        - name: courseId
          in: path
          required: true
          description: Identifiant du cours.
          schema:
            type: integer
            format: int64
        - name: tpNo
          in: path
          required: true
          description: Numéro de TP.
          schema:
            type: integer
      responses:
        '200':
          description: Traitement lancé.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TPDto'
        '404':
          description: Cours ou TP introuvable.
        '500':
          description: Erreur interne.

  /course/{courseId}/manageTP/{tpNo}:
    post:
      tags: [ submission ]
      summary: Gestion avancée d’un TP.
      description: Effectue des opérations de gestion avancée sur un TP.
      operationId: manageTP
      parameters:
        - name: courseId
          in: path
          required: true
          description: Identifiant du cours.
          schema:
            type: integer
            format: int64
        - name: tpNo
          in: path
          required: true
          description: Numéro de TP.
          schema:
            type: integer
      responses:
        '200':
          description: Résultat de la gestion du TP.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TPDto'
        '404':
          description: Cours ou TP introuvable.
        '500':
          description: Erreur interne.
  /course/{courseId}/downloadStructuredSubmission/{tpNo}:
    get:
      tags: [ submission ]
      summary: Téléchargement du rendu restructuré.
      description: Permet de télécharger le fichier ZIP restructuré des rendus d’un TP.
      operationId: downloadStructuredSubmission
      parameters:
        - name: courseId
          in: path
          required: true
          description: Identifiant du cours.
          schema:
            type: integer
            format: int64
        - name: tpNo
          in: path
          required: true
          description: Numéro de TP.
          schema:
            type: integer
      responses:
        '200':
          description: Fichier ZIP restructuré retourné.
          content:
            application/zip:
              schema:
                type: string
                format: binary
        '404':
          description: Cours ou TP introuvable.
        '500':
          description: Erreur interne.

  # ========================================
  #   STATUTS DES ETUDIANTS POUR UN TP
  #   (LISTE, DANS LE CONTEXTE D’UN COURS/TP)
  # ========================================
  /course/{courseId}/TPs/{tpNumber}/TPStatus:
    get:
      tags: [ course ]
      summary: Liste des statuts des étudiants pour un TP.
      description: Retourne tous les TPStatus (statuts étudiants) associés à un TP d’un cours.
      operationId: getTPStatusesByTP
      parameters:
        - name: courseId
          in: path
          required: true
          description: Identifiant du cours.
          schema:
            type: integer
            format: int64
        - name: tpNumber
          in: path
          required: true
          description: Numéro du TP.
          schema:
            type: integer
      responses:
        '200':
          description: Liste de statuts retournée.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/TPStatusDto'
        '404':
          description: Cours ou TP introuvable.
        '500':
          description: Erreur interne.
  /course/{courseId}/TPs/{tpNumber}/TPStatusRefresh:
    post:
      tags: [ course ]
      summary: Rafraîchissement des statuts des étudiants pour un TP.
      description: Met à jour les TPStatus (statuts étudiants) associés à un TP d’un cours, en fonction des rendus actuels.
      operationId: refreshTPStatusByTP
      parameters:
        - name: courseId
          in: path
          required: true
          description: Identifiant du cours.
          schema:
            type: integer
            format: int64
        - name: tpNumber
          in: path
          required: true
          description: Numéro du TP.
          schema:
            type: integer
      responses:
        '200':
          description: Statuts rafraîchis.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/TPStatusDto'
        '404':
          description: Cours ou TP introuvable.
        '500':
          description: Erreur interne.

  # ========================================
  #   RESSOURCE TPSTATUS INDIVIDUELLE
  #   (ACCÈS DIRECT PAR ID)
  # ========================================
  /TPStatus/{statusId}:
    get:
      tags: [ tp-status ]
      summary: Détail d’un statut pour un TP.
      description: Retourne un TPStatus spécifique. Le TP et le cours associés sont implicites via le statut.
      operationId: getTPStatusById
      parameters:
        - name: statusId
          in: path
          required: true
          description: Identifiant du statut (TPStatus).
          schema:
            type: integer
            format: int64
      responses:
        '200':
          description: Statut trouvé.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TPStatusDto'
        '404':
          description: Statut introuvable.
        '500':
          description: Erreur interne.
    delete:
      tags: [ tp-status ]
      summary: Suppression d’un statut pour un TP.
      description: Supprime un TPStatus spécifique.
      operationId: deleteTPStatus
      parameters:
        - name: statusId
          in: path
          required: true
          description: Identifiant du statut (TPStatus).
          schema:
            type: integer
            format: int64
      responses:
        '204':
          description: Statut supprimé.
        '404':
          description: Statut introuvable.
        '500':
          description: Erreur interne.
    put:
      tags: [ tp-status ]
      summary: Mise à jour d’un statut pour un TP.
      description: Met à jour un TPStatus, notamment le champ studentSubmission (enum).
      operationId: updateTPStatus
      parameters:
        - name: statusId
          in: path
          required: true
          description: Identifiant du statut (TPStatus).
          schema:
            type: integer
            format: int64
        - name: submissionType
          in: query
          required: true
          description: Nouvelle valeur du statut de soumission (StudentSubmissionType).
          schema:
            $ref: '#/components/schemas/StudentSubmissionType'
      responses:
        '200':
          description: Statut mis à jour.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TPStatusDto'
        '400':
          description: Données invalides.
        '404':
          description: Statut introuvable.
        '500':
          description: Erreur interne.

  # ========================================
  #   RESSOURCE EVALUATION
  # ========================================
  /evaluations/{evaluationId}:
    get:
      tags: [ evaluation ]
      summary: Détail d’une évaluation.
      description: Retourne une évaluation spécifique.
      operationId: getEvaluationById
      parameters:
        - name: evaluationId
          in: path
          required: true
          description: Identifiant de l’évaluation.
          schema:
            type: integer
            format: int64
      responses:
        '200':
          description: Évaluation trouvée.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EvaluationDto'
        '404':
          description: Évaluation introuvable.

    put:
      tags: [ evaluation ]
      summary: Mise à jour d’une évaluation.
      description: Met à jour une évaluation existante.
      operationId: updateEvaluation
      parameters:
        - name: evaluationId
          in: path
          required: true
          description: Identifiant de l’évaluation.
          schema:
            type: integer
            format: int64
      requestBody:
        description: Données mises à jour de l’évaluation.
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/EvaluationDto'
      responses:
        '200':
          description: Évaluation mise à jour.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EvaluationDto'
        '400':
          description: Données invalides.
        '404':
          description: Évaluation introuvable.

    delete:
      tags: [ evaluation ]
      summary: Suppression d’une évaluation.
      description: Supprime une évaluation existante.
      operationId: deleteEvaluation
      parameters:
        - name: evaluationId
          in: path
          required: true
          description: Identifiant de l’évaluation.
          schema:
            type: integer
            format: int64
      responses:
        '204':
          description: Évaluation supprimée.
        '404':
          description: Évaluation introuvable.

  /evaluations:
    post:
      tags: [ evaluation ]
      summary: Création d’une évaluation.
      description: Crée une nouvelle évaluation.
      operationId: createEvaluation
      requestBody:
        description: Données de l’évaluation.
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/EvaluationDto'
      responses:
        '201':
          description: Évaluation créée.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EvaluationDto'
        '400':
          description: Données invalides.

  /evaluations/{evaluationId}/submission:
    post:
      tags: [ evaluation ]
      summary: Ajouter un rendu ZIP à une évaluation.
      description: Ajoute un fichier ZIP (rendu Cyberlearn) à une évaluation.
      operationId: uploadSubmissionZipForEvaluation
      parameters:
        - name: evaluationId
          in: path
          required: true
          description: Identifiant de l’évaluation.
          schema:
            type: integer
            format: int64
      requestBody:
        description: Fichier ZIP du rendu.
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [ file ]
              properties:
                file:
                  type: string
                  format: binary
      responses:
        '200':
          description: Submission ajoutée à l’évaluation.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EvaluationDto'
        '400':
          description: Fichier invalide ou erreur lors de la copie.
        '404':
          description: Évaluation introuvable.

  /evaluations/{evaluationId}/submission/process:
    post:
      tags: [ evaluation ]
      summary: Lancer le traitement du rendu ZIP d’une évaluation.
      description: Déclenche le traitement du fichier ZIP associé à l’évaluation.
      operationId: startEvaluationSubmissionZipProcess
      parameters:
        - name: evaluationId
          in: path
          required: true
          description: Identifiant de l’évaluation.
          schema:
            type: integer
            format: int64
      responses:
        '204':
          description: Traitement lancé.
        '404':
          description: Évaluation introuvable.
        '500':
          description: Erreur lors du traitement.

  /evaluations/{evaluationId}/submission/restructurated:
    get:
      tags: [ evaluation ]
      summary: Télécharger le ZIP restructuré d’une évaluation.
      description: Récupère le fichier ZIP restructuré généré après traitement.
      operationId: downloadRestructuredSubmissionZipForEvaluation
      parameters:
        - name: evaluationId
          in: path
          required: true
          description: Identifiant de l’évaluation.
          schema:
            type: integer
            format: int64
      responses:
        '200':
          description: Fichier ZIP restructuré.
          content:
            application/zip:
              schema:
                type: string
                format: binary
        '204':
          description: Aucun fichier restructuré disponible.
        '404':
          description: Évaluation introuvable.


# ==============================
#   SCHEMAS (DTO)
# ==============================
components:
  schemas:

    # --- Enums techniques ---
    SemesterType:
      type: string
      description: Semestre académique.
      example: "AUTOMNE"

    CourseType:
      type: string
      description: Type de cours.
      example: "JAVA"

    StudyType:
      type: string
      description: Type d’étude.
      example: "TEMPS_PLEIN"
    StudentSubmissionType:
      type: string
      description: Statut de la soumission d’un étudiant pour un TP.
      example: "DONE"

    # --- DTO principaux exposés ---

    CourseDto:
      type: object
      description: Représentation d’un cours.
      properties:
        id:
          type: integer
          format: int64
          example: 1
        name:
          type: string
          example: "Python Introduction"
        code:
          type: string
          example: "61-13"
        semester:
          $ref: '#/components/schemas/SemesterType'
        courseType:
          $ref: '#/components/schemas/CourseType'
        year_course:
          type: integer
          example: 2025
        teacher:
          type: string
          example: "Stettler"
        students:
          type: array
          items:
            $ref: '#/components/schemas/StudentDto'
        tps:
          type: array
          items:
            $ref: '#/components/schemas/TPDto'
        evaluations:
          type: array
          items:
            $ref: '#/components/schemas/EvaluationDto'
      required: [ "id", "name", "code" ]
      example:
        id: 1
        name: "Python Introduction"
        code: "61-13"
        semester: "AUTOMNE"
        courseType: "PYTHON"
        year_course: 2025
        teacher: "Stettler"
        students: [ ]
        tps:
          - id: 10
            no: 1
            courseId: 1
            submission:
              id: 100
              fileName: "TP1_Rendus.zip"
              pathStorage: "/data/courses/61-13/TP1/TP1_Rendus.zip"
              pathFileStructured: "/data/courses/61-13/TP1/TP1_RenduRestructuration.zip"
            statusStudents: [ ]
        evaluations:
          - id: 200
            name: "Examen final"
            date: "2025-01-15"
            coefficient: 2
            courseId: 1

    EvaluationDto:
      type: object
      description: Représentation d’une évaluation.
      properties:
        id:
          type: integer
          format: int64
          example: 200
        name:
          type: string
          example: "Examen final"
        date:
          type: string
          format: date
          example: "2025-01-15"
        coefficient:
          type: integer
          example: 2
        courseId:
          type: integer
          format: int64
          example: 1
        mode:
          type: string
          enum: [CLASSIC, LOCAL_WS]
          description: Mode de restructuration du rendu (CLASSIC par défaut, LOCAL_WS pour dossiers HEG-WS + mapping).
          example: "CLASSIC"
      required: [ "name", "date", "coefficient", "courseId" ]
      example:
        id: 200
        name: "Examen final"
        date: "2025-01-15"
        coefficient: 2
        courseId: 1
        mode: "CLASSIC"

    StudentDto:
      type: object
      description: Représentation d’un étudiant.
      properties:
        id:
          type: integer
          format: int64
          example: 300
        name:
          type: string
          example: "George Dylan"
        email:
          type: string
          format: email
          example: "george.dylan@etu.hesge.ch"
        studyType:
          $ref: '#/components/schemas/StudyType'
        studentCourses:
          type: array
          items:
            $ref: '#/components/schemas/CourseDto'
      required: [ "name", "email", "studyType" ]
      example:
        id: 300
        name: "George Dylan"
        email: "george.dylan@etu.hesge.ch"
        studyType: "FULL_TIME"
        studentCourses:
          - id: 1
            name: "Python Introduction"
            code: "61-13"
            semester: "AUTOMNE"
            courseType: "PYTHON"
            year_course: 2025
            teacher: "Stettler"

    SubmissionDto:
      type: object
      description: Représentation d’un rendu (fichier ZIP) pour un TP.
      properties:
        id:
          type: integer
          format: int64
          example: 100
        fileName:
          type: string
          example: "TP1_Rendus.zip"
        pathStorage:
          type: string
          description: Chemin de stockage du ZIP original.
          example: "/data/courses/61-13/TP1/TP1_Rendus.zip"
        pathFileStructured:
          type: string
          description: Chemin du ZIP restructuré.
          example: "/data/courses/61-13/TP1/TP1_RenduRestructuration.zip"
        pathMappingFile:
          type: string
          description: Chemin du fichier mapping.txt (mode LOCAL_WS uniquement, piloté par l'Evaluation).
          example: "/data/courses/61-13/Examen/mapping.txt"
      required: [ "fileName", "pathStorage" ]
      example:
        id: 100
        fileName: "TP1_Rendus.zip"
        pathStorage: "/data/courses/61-13/TP1/TP1_Rendus.zip"
        pathFileStructured: "/data/courses/61-13/TP1/TP1_RenduRestructuration.zip"

    TPDto:
      type: object
      description: Représentation d’un TP pour un cours.
      properties:
        id:
          type: integer
          format: int64
          example: 10
        "no":
          type: integer
          example: 1
        courseId:
          type: integer
          format: int64
          example: 1
        submission:
          $ref: '#/components/schemas/SubmissionDto'
        statusStudents:
          type: array
          items:
            $ref: '#/components/schemas/TPStatusDto'
      required: [ "no", "courseId" ]
      example:
        id: 10
        no: 1
        courseId: 1
        submission:
          id: 100
          fileName: "TP1_Rendus.zip"
          pathStorage: "/data/courses/61-13/TP1/TP1_Rendus.zip"
          pathFileStructured: "/data/courses/61-13/TP1/TP1_RenduRestructuration.zip"
        statusStudents:
          - id: 1000
            studentId: 300
            tpId: 10
            studentSubmission: true

    TPStatusDto:
      type: object
      description: Statut d’un étudiant pour un TP.
      properties:
        id:
          type: integer
          format: int64
          example: 1000
        studentId:
          type: integer
          format: int64
          example: 300
        tpId:
          type: integer
          format: int64
          example: 10
        studentSubmission:
          type: boolean
          example: true
      required: [ "studentId", "tpId", "studentSubmission" ]
      example:
        id: 1000
        studentId: 300
        tpId: 10
        studentSubmission: true

    CourseAccessDto:
      type: object
      description: Représentation d'un accès cours-utilisateur.
      properties:
        id:
          type: integer
          format: int64
          example: 1
        userId:
          type: string
          example: "2f1c3a9d-1234-4567-8901-abcdef123456"
        courseId:
          type: integer
          format: int64
          example: 10
        permission:
          type: string
          description: Niveau de permission.
          enum: [READ, WRITE, OWNER]
          example: "READ"
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
      required: [userId, courseId, permission]
      example:
        id: 1
        userId: "2f1c3a9d-1234-4567-8901-abcdef123456"
        courseId: 10
        permission: "READ"

  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT

security:
  - bearerAuth: []
