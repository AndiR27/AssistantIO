<form [formGroup]="form" (ngSubmit)="onSubmit()" class="tp-form">

  <mat-form-field appearance="outline">
    <mat-label>Numéro du TP</mat-label>
    <input matInput type="number" formControlName="noTp" min="1" placeholder="Ex: 1, 2, 3..." />
    <mat-icon matPrefix>tag</mat-icon>
    @if (form.controls.noTp.touched && form.controls.noTp.invalid) {
    <mat-error>Requis</mat-error>
    }
  </mat-form-field>

  <div class="file-section">
    <input type="file" #fileInputRef (change)="onFileChange($event)" accept=".zip" hidden />

    <button mat-stroked-button type="button" class="choose-file-btn" (click)="fileInputRef.click()">
      <mat-icon>attach_file</mat-icon>
      <span>{{ file ? file.name : 'Choisir un fichier .zip' }}</span>
    </button>

    @if (file) {
    <span class="file-size">{{ (file.size / 1024 / 1024).toFixed(1) }} Mo</span>
    }
  </div>

  <button mat-raised-button color="primary" class="submit-btn" type="submit"
    [disabled]="form.invalid || !file || isUploading">
    @if (isUploading) {
      <mat-icon class="spinning">sync</mat-icon>
      <span>Envoi...</span>
    } @else {
      <mat-icon>add_circle</mat-icon>
      <span>Ajouter</span>
    }
  </button>

  @if (successMsg) {
  <div class="success-message">
    <mat-icon>check_circle</mat-icon>
    <span>{{ successMsg }}</span>
  </div>
  }

  @if (errorMsg) {
  <div class="error-message">
    <mat-icon>error</mat-icon>
    <span>{{ errorMsg }}</span>
  </div>
  }
</form>
