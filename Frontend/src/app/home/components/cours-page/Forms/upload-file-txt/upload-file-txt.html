<form (ngSubmit)="onSubmit()" class="upload-form">

  <div class="file-section">
    <input type="file" #fileInputRef (change)="onFileSelected($event)" accept=".txt" hidden />

    <button mat-stroked-button type="button" class="choose-file-btn" (click)="fileInputRef.click()">
      <mat-icon>attach_file</mat-icon>
      <span>{{ file ? file.name : 'Fichier .txt' }}</span>
    </button>

    @if (file && lineCount() !== null) {
    <span class="line-count">{{ lineCount() }} ligne(s)</span>
    }
  </div>

  <button mat-raised-button color="primary" class="submit-btn" type="submit" [disabled]="!file || isUploading">
    @if (isUploading) {
      <mat-icon class="spinning">sync</mat-icon>
      <span>Import...</span>
    } @else {
      <mat-icon>cloud_upload</mat-icon>
      <span>Importer</span>
    }
  </button>

  @if (lineCount() !== null && !isUploading && !file) {
  <div class="success-message">
    <mat-icon>check_circle</mat-icon>
    <span>{{ lineCount() }} étudiant{{ lineCount()! > 1 ? 's' : '' }} importé{{ lineCount()! > 1 ? 's' : '' }} !</span>
  </div>
  }
</form>
